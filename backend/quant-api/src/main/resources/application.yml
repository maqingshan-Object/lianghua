server:
  port: 8080

# 应用配置（全部可用启动参数覆盖，如 --app.db-path=/data/quant.db）
app:
  # SQLite 库路径（M1 采集 + M2/M3/M4 读写同一库）
  db-path: ${user.home}/workspace/quant/data/quant.db
  # Vue 前端构建产物（M5b 产出 dist 后自动托管；不存在则 / 返回 API 状态）
  frontend-dist: ../frontend/dist
  # Python 采集脚本（每日任务用 ProcessBuilder 调用）
  collector-python: ${user.home}/workspace/quant/venv/bin/python
  collector-script: ${user.home}/workspace/quant/collector/collect.py
  # 回测 HTML 报告落盘目录
  reports-dir: ${user.home}/workspace/quant/backend/quant-api/reports
  # AI 通道：true 则用 MockAISignalStrategy（真实 DeepSeek 接线等 Ma 提供 Key 后再做）
  ai-mock: false
  # DeepSeek API Key：只从环境变量 DEEPSEEK_API_KEY 注入（Spring 自动映射），
  # 此处绝不填写真实值。部署时在服务器上 export DEEPSEEK_API_KEY=xxx 后再启动。
  # deepseek-api-key: ${DEEPSEEK_API_KEY:}
  daily-job:
    # 总开关（默认关闭；生产用 cron 调用 POST /api/jobs/daily，见 README）
    enabled: false
    # 启用时的 Spring cron（默认每个交易日 16:30；非交易日 runDay 自行跳过）
    cron: "0 30 16 * * ?"
    # 采集子进程超时（分钟）
    collector-timeout-minutes: 30

logging:
  level:
    com.quant: INFO
    org.springframework.web: WARN
